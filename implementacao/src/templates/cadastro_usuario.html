{% extends "base.html" %}
{% block titulo %}Criar conta — Task Tracker{% endblock %}

{% block conteudo %}
<div class="cartao">
  <p class="sobrenome">Bootcamp II · CEUB</p>
  <h1 class="titulo-entrada">Criar conta</h1>
  <p class="apoio">Sua conta é pessoal: só você enxerga as suas tarefas.</p>

  <form method="post" class="formulario">
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">

    <label for="nome">Nome</label>
    <input type="text" id="nome" name="nome" value="{{ nome }}" required autofocus
           autocomplete="name" maxlength="80">

    <label for="login">E-mail</label>
    <input type="email" id="login" name="login" value="{{ login_digitado }}"
           required autocomplete="username" inputmode="email">

    <label for="senha">Senha</label>
    <input type="password" id="senha" name="senha" required minlength="6"
           autocomplete="new-password" aria-describedby="ajuda-senha">
    <p class="ajuda" id="ajuda-senha">Mínimo de 6 caracteres.</p>

    <button class="botao botao-primario largo" type="submit">Criar conta</button>
  </form>

  <p class="alternativa">
    Já tem conta? <a href="{{ url_for('login') }}">Entrar</a>
  </p>
</div>
{% endblock %}
